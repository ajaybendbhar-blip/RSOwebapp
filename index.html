<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSO Monthly Sales App</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#1f2937}
    .wrap{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
    h1,h2{margin:0 0 12px;color:#0f4c5c}
    .section{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}
    button{background:#0f766e;color:#fff;border:none;font-weight:700;cursor:pointer}
    .msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;white-space:pre-wrap}
    .ok{display:block;background:#ecfdf5;color:#166534}
    .err{display:block;background:#fef2f2;color:#991b1b}
    .hidden{display:none!important}
    .models{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .small{font-size:12px;color:#6b7280}
    .readonly{background:#f8fafc}
    iframe{display:none}
    @media(max-width:900px){.grid,.models{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.grid,.models{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>RSO Monthly Sales App</h1>
  <div id="msg" class="msg"></div>

  <div id="loginSection" class="section">
    <h2>Login</h2>
    <div class="grid">
      <input id="empId" placeholder="Emp Id">
      <input id="password" type="password" placeholder="Password" value="Daikin@123">
      <button type="button" onclick="login()">Login</button>
    </div>
  </div>

  <div id="profileSection" class="section hidden">
    <h2>RSO Details</h2>
    <div class="grid">
      <input id="branch" class="readonly" readonly>
      <input id="agencyCode" class="readonly" readonly>
      <input id="rsoName" class="readonly" readonly>
      <input id="empIdView" class="readonly" readonly>
      <input id="asmName" class="readonly" readonly>
      <input id="ddCode" class="readonly" readonly>
      <input id="ddName" class="readonly" readonly>
      <input id="cityView" class="readonly" readonly>
      <input id="month" type="month">
    </div>
  </div>

  <div id="entrySection" class="section hidden">
    <h2>Monthly Sales Entry</h2>
    <div class="grid">
      <input id="subDealerSearch" placeholder="Search Sub Dealer Name" oninput="filterSubDealers()">
      <select id="subDealerDropdown" onchange="loadDealerDetails()">
        <option value="">Select Sub Dealer</option>
      </select>
      <input id="subDealerCode" class="readonly" readonly>
      <input id="storeId" class="readonly" readonly>
      <input id="dealerCity" class="readonly" readonly>
      <input id="areaMarket" class="readonly" readonly>
      <input id="subDealerCategory" class="readonly" readonly>
      <input id="annualPotential" class="readonly" readonly>
      <input id="annualSaleUpdated" type="number" min="0" placeholder="Annual Sale Updated">
      <input id="storeDisplayUpdated" type="number" min="0" placeholder="Total Counter Display Updated">
      <input id="daikinDisplayUpdated" type="number" min="0" placeholder="Daikin Display Updated">
    </div>

    <h2 style="margin-top:18px">Model-wise Monthly Sales</h2>
    <div id="modelsBox" class="models"></div>

    <form id="submitForm" method="POST" target="hiddenFrame" action="https://script.google.com/macros/s/AKfycbwIgAUpm1g5lWVcegOScaLaQujHmKUyttsJgAY-AmRODw6AkDFyDh0rDA1O_tARP7qT/exec">
      <input type="hidden" name="action" value="submitSales">
      <input type="hidden" name="month" id="f_month">
      <input type="hidden" name="branch" id="f_branch">
      <input type="hidden" name="agencyCode" id="f_agencyCode">
      <input type="hidden" name="rsoName" id="f_rsoName">
      <input type="hidden" name="empId" id="f_empId">
      <input type="hidden" name="asmName" id="f_asmName">
      <input type="hidden" name="ddCode" id="f_ddCode">
      <input type="hidden" name="ddName" id="f_ddName">
      <input type="hidden" name="storeId" id="f_storeId">
      <input type="hidden" name="subDealerCode" id="f_subDealerCode">
      <input type="hidden" name="subDealerName" id="f_subDealerName">
      <input type="hidden" name="city" id="f_city">
      <input type="hidden" name="areaMarket" id="f_areaMarket">
      <input type="hidden" name="subDealerCategory" id="f_subDealerCategory">
      <input type="hidden" name="annualPotential" id="f_annualPotential">
      <input type="hidden" name="annualSaleUpdated" id="f_annualSaleUpdated">
      <input type="hidden" name="storeDisplayUpdated" id="f_storeDisplayUpdated">
      <input type="hidden" name="daikinDisplayUpdated" id="f_daikinDisplayUpdated">
      <div id="hiddenModelFields"></div>
    </form>

    <iframe name="hiddenFrame"></iframe>

    <div style="margin-top:16px">
      <button type="button" onclick="submitSales()">Submit Monthly Sales</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIgAUpm1g5lWVcegOScaLaQujHmKUyttsJgAY-AmRODw6AkDFyDh0rDA1O_tARP7qT/exec';
const MODEL_COLUMNS = ["FTL30","FTL50","FTE60","FTKC35","FTKC48","FTKL50","FTKC50","FTKL60","FTKU35","FTKU50","FTKM50","FTKL71","FTKL90"];
let currentRSO = null;
let subDealers = [];
let filteredSubDealers = [];

function showMsg(text, type='ok'){
  const el = document.getElementById('msg');
  el.className = 'msg ' + (type === 'error' ? 'err' : 'ok');
  el.textContent = text;
}

function createModelInputs(){
  const box = document.getElementById('modelsBox');
  box.innerHTML = '';
  MODEL_COLUMNS.forEach(model => {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<label class=\"small\">' + model + '</label><input type=\"number\" min=\"0\" id=\"model_' + model + '\" placeholder=\"' + model + ' Qty\">';
    box.appendChild(wrap);
  });
}
createModelInputs();

function login(){
  const empId = document.getElementById('empId').value.trim();
  const password = document.getElementById('password').value.trim();
  if(!empId || !password){ showMsg('Enter Emp Id and password','error'); return; }

  showMsg('Checking login...');
  const cb = 'jsonpLoginCallback_' + Date.now();
  window[cb] = function(json){
    try{
      if(!json.success) throw new Error(json.message || 'Login failed');
      currentRSO = json.profile || {};
      subDealers = json.subDealers || [];
      filteredSubDealers = [...subDealers];

      document.getElementById('branch').value = currentRSO.branch || '';
      document.getElementById('agencyCode').value = currentRSO.agencyCode || '';
      document.getElementById('rsoName').value = currentRSO.rsoName || '';
      document.getElementById('empIdView').value = currentRSO.empId || '';
      document.getElementById('asmName').value = currentRSO.asmName || '';
      document.getElementById('ddCode').value = currentRSO.ddCode || '';
      document.getElementById('ddName').value = currentRSO.ddName || '';
      document.getElementById('cityView').value = currentRSO.city || '';

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('profileSection').classList.remove('hidden');
      document.getElementById('entrySection').classList.remove('hidden');
      renderSubDealerDropdown(filteredSubDealers);
      showMsg('Login successful');
    }catch(err){
      showMsg(err.message, 'error');
    }finally{
      delete window[cb];
      s.remove();
    }
  };

  const s = document.createElement('script');
  s.src = APPS_SCRIPT_URL + '?action=login&empId=' + encodeURIComponent(empId) + '&password=' + encodeURIComponent(password) + '&callback=' + cb;
  s.onerror = function(){
    showMsg('Login request failed. Check Apps Script deployment access.', 'error');
    delete window[cb];
    s.remove();
  };
  document.body.appendChild(s);
}

function renderSubDealerDropdown(list){
  const dd = document.getElementById('subDealerDropdown');
  dd.innerHTML = '<option value=\"\">Select Sub Dealer</option>';
  list.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = item.subDealerName || '';
    dd.appendChild(opt);
  });
}

function filterSubDealers(){
  const q = document.getElementById('subDealerSearch').value.trim().toLowerCase();
  filteredSubDealers = subDealers.filter(x => (x.subDealerName || '').toLowerCase().includes(q));
  renderSubDealerDropdown(filteredSubDealers);
  clearDealerDetails();
}

function clearDealerDetails(){
  ['subDealerCode','storeId','dealerCity','areaMarket','subDealerCategory','annualPotential','annualSaleUpdated','storeDisplayUpdated','daikinDisplayUpdated'].forEach(id => document.getElementById(id).value = '');
  MODEL_COLUMNS.forEach(m => document.getElementById('model_' + m).value = '');
}

function loadDealerDetails(){
  const idx = document.getElementById('subDealerDropdown').value;
  if(idx === '') return clearDealerDetails();
  const d = filteredSubDealers[Number(idx)];
  document.getElementById('subDealerCode').value = d.subDealerCode || '';
  document.getElementById('storeId').value = d.storeId || '';
  document.getElementById('dealerCity').value = d.city || '';
  document.getElementById('areaMarket').value = d.areaMarket || '';
  document.getElementById('subDealerCategory').value = d.subDealerCategory || '';
  document.getElementById('annualPotential').value = d.annualPotential || '';
  document.getElementById('storeDisplayUpdated').value = d.storeTotalDisplay || '';
  document.getElementById('daikinDisplayUpdated').value = d.daikinDisplay || '';
}

function submitSales(){
  if(!currentRSO) return showMsg('Please login first', 'error');
  const idx = document.getElementById('subDealerDropdown').value;
  if(idx === '') return showMsg('Please select Sub Dealer', 'error');
  const month = document.getElementById('month').value;
  if(!month) return showMsg('Please select month', 'error');

  const dealer = filteredSubDealers[Number(idx)];
  document.getElementById('f_month').value = month;
  document.getElementById('f_branch').value = currentRSO.branch || '';
  document.getElementById('f_agencyCode').value = currentRSO.agencyCode || '';
  document.getElementById('f_rsoName').value = currentRSO.rsoName || '';
  document.getElementById('f_empId').value = currentRSO.empId || '';
  document.getElementById('f_asmName').value = currentRSO.asmName || '';
  document.getElementById('f_ddCode').value = currentRSO.ddCode || '';
  document.getElementById('f_ddName').value = currentRSO.ddName || '';
  document.getElementById('f_storeId').value = dealer.storeId || '';
  document.getElementById('f_subDealerCode').value = dealer.subDealerCode || '';
  document.getElementById('f_subDealerName').value = dealer.subDealerName || '';
  document.getElementById('f_city').value = dealer.city || '';
  document.getElementById('f_areaMarket').value = dealer.areaMarket || '';
  document.getElementById('f_subDealerCategory').value = dealer.subDealerCategory || '';
  document.getElementById('f_annualPotential').value = dealer.annualPotential || '';
  document.getElementById('f_annualSaleUpdated').value = document.getElementById('annualSaleUpdated').value || '';
  document.getElementById('f_storeDisplayUpdated').value = document.getElementById('storeDisplayUpdated').value || '';
  document.getElementById('f_daikinDisplayUpdated').value = document.getElementById('daikinDisplayUpdated').value || '';

  const hiddenBox = document.getElementById('hiddenModelFields');
  hiddenBox.innerHTML = '';
  MODEL_COLUMNS.forEach(m => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = m;
    input.value = document.getElementById('model_' + m).value || 0;
    hiddenBox.appendChild(input);
  });

  showMsg('Submitting monthly sales...');
  document.getElementById('submitForm').submit();
  showMsg('Submission sent. Please check RSO_Monthly_Sales sheet.', 'ok');
}
</script>
</body>
</html>
