<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSO Monthly Sales App</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#1f2937}
    .wrap{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
    h1,h2{margin:0 0 12px;color:#0f4c5c}
    .section{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}
    button{background:#0f766e;color:#fff;border:none;font-weight:700;cursor:pointer}
    button:hover{background:#0d655e}
    .msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;white-space:pre-wrap}
    .ok{display:block;background:#ecfdf5;color:#166534}
    .err{display:block;background:#fef2f2;color:#991b1b}
    .hidden{display:none!important}
    .models{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .small{font-size:12px;color:#6b7280}
    .readonly{background:#f8fafc}
    @media(max-width:900px){.grid,.models{grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.grid,.models{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>RSO Monthly Sales App</h1>
  <div id="msg" class="msg"></div>

  <div id="loginSection" class="section">
    <h2>Login</h2>
    <div class="grid">
      <input id="empId" placeholder="Emp Id">
      <input id="password" type="password" placeholder="Password" value="Daikin@123">
      <button type="button" onclick="login()">Login</button>
    </div>
    <div class="small" style="margin-top:8px">Username = Emp Id | Default password = Daikin@123</div>
  </div>

  <div id="profileSection" class="section hidden">
    <h2>RSO Details</h2>
    <div class="grid">
      <input id="branch" class="readonly" placeholder="Branch" readonly>
      <input id="agencyCode" class="readonly" placeholder="Agency Code" readonly>
      <input id="rsoName" class="readonly" placeholder="RSO Name" readonly>
      <input id="empIdView" class="readonly" placeholder="Emp Id" readonly>
      <input id="asmName" class="readonly" placeholder="ASM Name" readonly>
      <input id="ddCode" class="readonly" placeholder="D&D Code" readonly>
      <input id="ddName" class="readonly" placeholder="D&D Name" readonly>
      <input id="cityView" class="readonly" placeholder="City" readonly>
      <input id="month" type="month">
    </div>
  </div>

  <div id="entrySection" class="section hidden">
    <h2>Monthly Sales Entry</h2>
    <div class="grid">
      <input id="subDealerSearch" placeholder="Search Sub Dealer Name" oninput="filterSubDealers()">
      <select id="subDealerDropdown" onchange="loadDealerDetails()">
        <option value="">Select Sub Dealer</option>
      </select>
      <input id="subDealerCode" class="readonly" placeholder="Sub Dealer Code" readonly>
      <input id="storeId" class="readonly" placeholder="Store Id" readonly>
      <input id="dealerCity" class="readonly" placeholder="City" readonly>
      <input id="areaMarket" class="readonly" placeholder="Area / Market" readonly>
      <input id="subDealerCategory" class="readonly" placeholder="Sub-Dealer Category" readonly>
      <input id="annualPotential" class="readonly" placeholder="Annual Potential-AC" readonly>
      <input id="annualSaleUpdated" type="number" min="0" placeholder="Annual Sale Updated">
      <input id="storeDisplayUpdated" type="number" min="0" placeholder="Total Counter Display Updated">
      <input id="daikinDisplayUpdated" type="number" min="0" placeholder="Daikin Display Updated">
    </div>

    <h2 style="margin-top:18px">Model-wise Monthly Sales</h2>
    <div id="modelsBox" class="models"></div>

    <div style="margin-top:16px">
      <button type="button" onclick="submitSales()">Submit Monthly Sales</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7ZIoMF9GuRBp1aea_LUuT7VBZLrS3EJz3HKRQkmi4r9wCnwNIglwYGYB9X09nxxoB/exec';
const MODEL_COLUMNS = ["FTL30","FTL50","FTE60","FTKC35","FTKC48","FTKL50","FTKC50","FTKL60","FTKU35","FTKU50","FTKM50","FTKL71","FTKL90"];

let currentRSO = null;
let subDealers = [];
let filteredSubDealers = [];

function showMsg(text, type='ok'){
  const el = document.getElementById('msg');
  el.className = 'msg ' + (type === 'error' ? 'err' : 'ok');
  el.textContent = text;
}

async function readJsonSafe(res){
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch(e) {
    throw new Error('Server returned non-JSON response. Please check Apps Script deployment access and sheet names. Response starts with: ' + text.slice(0,160));
  }
}

function createModelInputs(){
  const box = document.getElementById('modelsBox');
  box.innerHTML = '';
  MODEL_COLUMNS.forEach(model => {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<label class="small">' + model + '</label><input type="number" min="0" id="model_' + model + '" placeholder="' + model + ' Qty">';
    box.appendChild(wrap);
  });
}
createModelInputs();

async function login(){
  try{
    const empId = document.getElementById('empId').value.trim();
    const password = document.getElementById('password').value.trim();

    if(!empId || !password){
      showMsg('Enter Emp Id and password','error');
      return;
    }

    showMsg('Checking login...');
    const url = APPS_SCRIPT_URL + '?action=login&empId=' + encodeURIComponent(empId) + '&password=' + encodeURIComponent(password);
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    const json = await readJsonSafe(res);

    if(!json.success) throw new Error(json.message || 'Login failed');

    currentRSO = json.profile || {};
    subDealers = json.subDealers || [];
    filteredSubDealers = [...subDealers];

    document.getElementById('branch').value = currentRSO.branch || '';
    document.getElementById('agencyCode').value = currentRSO.agencyCode || '';
    document.getElementById('rsoName').value = currentRSO.rsoName || '';
    document.getElementById('empIdView').value = currentRSO.empId || '';
    document.getElementById('asmName').value = currentRSO.asmName || '';
    document.getElementById('ddCode').value = currentRSO.ddCode || '';
    document.getElementById('ddName').value = currentRSO.ddName || '';
    document.getElementById('cityView').value = currentRSO.city || '';

    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('profileSection').classList.remove('hidden');
    document.getElementById('entrySection').classList.remove('hidden');

    renderSubDealerDropdown(filteredSubDealers);
    showMsg('Login successful');
  }catch(err){
    showMsg(err.message, 'error');
  }
}

function renderSubDealerDropdown(list){
  const dd = document.getElementById('subDealerDropdown');
  dd.innerHTML = '<option value="">Select Sub Dealer</option>';
  list.forEach((item, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = item.subDealerName || '';
    dd.appendChild(opt);
  });
}

function filterSubDealers(){
  const q = document.getElementById('subDealerSearch').value.trim().toLowerCase();
  filteredSubDealers = subDealers.filter(x => (x.subDealerName || '').toLowerCase().includes(q));
  renderSubDealerDropdown(filteredSubDealers);
  clearDealerDetails();
}

function clearDealerDetails(){
  document.getElementById('subDealerCode').value = '';
  document.getElementById('storeId').value = '';
  document.getElementById('dealerCity').value = '';
  document.getElementById('areaMarket').value = '';
  document.getElementById('subDealerCategory').value = '';
  document.getElementById('annualPotential').value = '';
  document.getElementById('annualSaleUpdated').value = '';
  document.getElementById('storeDisplayUpdated').value = '';
  document.getElementById('daikinDisplayUpdated').value = '';
  MODEL_COLUMNS.forEach(m => document.getElementById('model_' + m).value = '');
}

function loadDealerDetails(){
  const idx = document.getElementById('subDealerDropdown').value;
  if(idx === '') {
    clearDealerDetails();
    return;
  }

  const d = filteredSubDealers[Number(idx)];
  document.getElementById('subDealerCode').value = d.subDealerCode || '';
  document.getElementById('storeId').value = d.storeId || '';
  document.getElementById('dealerCity').value = d.city || '';
  document.getElementById('areaMarket').value = d.areaMarket || '';
  document.getElementById('subDealerCategory').value = d.subDealerCategory || '';
  document.getElementById('annualPotential').value = d.annualPotential || '';
  document.getElementById('annualSaleUpdated').value = '';
  document.getElementById('storeDisplayUpdated').value = d.storeTotalDisplay || '';
  document.getElementById('daikinDisplayUpdated').value = d.daikinDisplay || '';
  MODEL_COLUMNS.forEach(m => document.getElementById('model_' + m).value = '');
}

async function submitSales(){
  try{
    if(!currentRSO) throw new Error('Please login first');

    const idx = document.getElementById('subDealerDropdown').value;
    if(idx === '') throw new Error('Please select Sub Dealer');

    const month = document.getElementById('month').value;
    if(!month) throw new Error('Please select month');

    const dealer = filteredSubDealers[Number(idx)];
    const modelSales = {};
    let total = 0;

    MODEL_COLUMNS.forEach(m => {
      const val = Number(document.getElementById('model_' + m).value || 0);
      modelSales[m] = val;
      total += val;
    });

    const payload = {
      action: 'submitSales',
      month: month,
      profile: currentRSO,
      dealer: dealer,
      annualSaleUpdated: document.getElementById('annualSaleUpdated').value,
      storeDisplayUpdated: document.getElementById('storeDisplayUpdated').value,
      daikinDisplayUpdated: document.getElementById('daikinDisplayUpdated').value,
      modelSales: modelSales,
      total: total
    };

    showMsg('Submitting monthly sales...');
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      redirect: 'follow'
    });

    const json = await readJsonSafe(res);
    if(!json.success) throw new Error(json.message || 'Submit failed');

    showMsg('Monthly sales submitted successfully');
    clearDealerDetails();
    document.getElementById('subDealerDropdown').value = '';
    document.getElementById('subDealerSearch').value = '';
    filteredSubDealers = [...subDealers];
    renderSubDealerDropdown(filteredSubDealers);
  }catch(err){
    showMsg(err.message, 'error');
  }
}
</script>
</body>
</html>
